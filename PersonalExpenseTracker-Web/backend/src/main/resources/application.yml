server:
  port: ${PORT:8080}

spring:
  application:
    name: personal-expense-tracker-backend

  datasource:
    # If DATABASE_URL or SPRING_DATASOURCE_URL is supplied (e.g. Neon on Render), use PostgreSQL.
    # Otherwise fallback to H2 embedded database for effortless zero-config local run.
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/expense_web_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

# Security & JWT Configuration
app:
  jwt:
    # 256-bit base64/hex secret for HMAC-SHA256 (default for dev only; production requires JWT_SECRET)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}
